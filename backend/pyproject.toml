[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "S", "B", "A", "C4", "T20"]
ignore = [
    "ANN101", "ANN102", "ANN401",
    "S101",   # allow assert in tests
    "B008",   # FastAPI Depends() pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN"]
"scripts/*" = ["T20", "ANN"]
"alembic/*" = ["ANN"]

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/alembic/*", "tests/*"]
