[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "S", "B", "A", "C4", "T20"]
ignore = [
    "ANN101", "ANN102", "ANN401",
    "S101",   # allow assert in tests
    "B008",   # FastAPI Depends() pattern
    "E501",   # ignore line-too-long
    "B904",   # ignore raise-without-from
    "E402",   # ignore module-import-not-at-top-of-file
    "ANN201", # ignore missing-return-type-undocumented-public-function
    "ANN202", # ignore missing-return-type-private-function
    "S105",   # ignore hardcoded-password-string false positives
    "S106",   # ignore hardcoded-password-func-arg false positives
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN"]
"scripts/*" = ["T20", "ANN"]
"alembic/*" = ["ANN"]

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/alembic/*", "tests/*"]
