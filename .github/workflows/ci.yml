name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: careflow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Type check (mypy)
        run: mypy app --ignore-missing-imports

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/careflow_test
          JWT_SECRET: ci-test-secret-at-least-16-chars
          INTERNAL_JOB_SECRET: ci-job-secret
        run: alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/careflow_test
          JWT_SECRET: ci-test-secret-at-least-16-chars
          JWT_EXPIRE_MINUTES: "60"
          TOKEN_ENCRYPTION_KEY: ""
          ENABLE_LLM: "false"
          ENABLE_EMAIL: "false"
          ENABLE_GOOGLE_CALENDAR: "false"
          INTERNAL_JOB_SECRET: ci-job-secret
          FRONTEND_URL: http://localhost:3000
          BACKEND_URL: http://localhost:8000
          CORS_ORIGINS: http://localhost:3000
          ENVIRONMENT: test
        run: pytest tests/ -v --cov=app --cov-report=term-missing

  frontend:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
